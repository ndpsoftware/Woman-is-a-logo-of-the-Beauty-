<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Global Digital Clock</h1>
        <div class="clocks-grid">
            <!-- UTC -->
            <div class="clock-card">
                <h2>UTC</h2>
                <div id="utc-clock" class="clock">00:00:00</div>
            </div>

            <!-- EST (New York) -->
            <div class="clock-card">
                <h2>EST (New York)</h2>
                <div id="est-clock" class="clock">00:00:00</div>
            </div>

            <!-- PST (Los Angeles) -->
            <div class="clock-card">
                <h2>PST (Los Angeles)</h2>
                <div id="pst-clock" class="clock">00:00:00</div>
            </div>

            <!-- CST (Chicago) -->
            <div class="clock-card">
                <h2>CST (Chicago)</h2>
                <div id="cst-clock" class="clock">00:00:00</div>
            </div>

            <!-- GMT (London) -->
            <div class="clock-card">
                <h2>GMT (London)</h2>
                <div id="gmt-clock" class="clock">00:00:00</div>
            </div>

            <!-- IST (India) -->
            <div class="clock-card">
                <h2>IST (India)</h2>
                <div id="ist-clock" class="clock">00:00:00</div>
            </div>

            <!-- JST (Tokyo) -->
            <div class="clock-card">
                <h2>JST (Tokyo)</h2>
                <div id="jst-clock" class="clock">00:00:00</div>
            </div>

            <!-- AEST (Sydney) -->
            <div class="clock-card">
                <h2>AEST (Sydney)</h2>
                <div id="aest-clock" class="clock">00:00:00</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
